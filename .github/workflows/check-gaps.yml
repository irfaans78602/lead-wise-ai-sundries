name: Ask AI Gap Analysis

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC
  workflow_dispatch:      # Allows you to trigger it manually from the GitHub UI

jobs:
  check-gaps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run gap analysis script
        env:
          # Secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CONTACT_LOG_IP_SALT: ${{ secrets.CONTACT_LOG_IP_SALT }}
          
          # Variables
          CONTACT_TO: ${{ vars.CONTACT_TO }}
          CONTACT_FROM: ${{ vars.CONTACT_FROM }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TIMEOUT_SECONDS: ${{ vars.GEMINI_TIMEOUT_SECONDS }}
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python tools/check_gaps.py